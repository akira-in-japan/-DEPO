<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ログイン')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('mypage')}"></header>
<!-- ログイン（フロントだけ）。送信しても認証・保存はしない。本物のログインは今後（10_未決定事項） -->
<main class="main narrow"><div class="content">
  <section class="page-hero hero-help">
    <div th:replace="~{fragments/layout :: depotaTitle('ログイン')}"></div>
    <p>メールアドレスとパスワードでログインします。</p>
  </section>
  <p class="done-msg" th:if="${sent}" role="status">ログイン機能はいま準備中です。もうしばらくお待ちください。</p>
  <section class="panel auth-card">
    <form method="post" th:action="@{/login}" novalidate>
      <div class="auth-field"><label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="例：odekake@example.com" maxlength="100"></div>
      <div class="auth-field"><label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="8文字以上" maxlength="64"></div>
      <label class="auth-check"><input type="checkbox" name="remember"> ログインしたままにする</label>
      <button class="btn btn-lg auth-submit" type="submit">ログイン</button>
    </form>
    <p class="auth-links"><a href="#" aria-disabled="true">パスワードを忘れた方</a>｜<a th:href="@{/mypage/settings}">新しく登録する</a></p>
  </section>
  <p><a th:href="@{/mypage}">← マイページに戻る</a></p>
</div></main>
<div th:replace="~{fragments/layout :: landscape}"></div>
</body>
</html>
