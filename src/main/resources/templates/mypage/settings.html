<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ユーザー情報の設定')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('mypage')}"></header>
<!-- ユーザー情報の設定（フロントだけ）。ニックネーム以外は保存しない。個人情報を保存するのはログインを作ってから（10_未決定事項） -->
<main class="main narrow"><div class="content">
  <section class="page-hero hero-help">
    <div th:replace="~{fragments/layout :: depotaTitle('ユーザー情報の設定')}"></div>
    <p>あなたの情報を設定します。</p>
  </section>
  <p class="done-msg" th:if="${sent}" role="status">ユーザー情報の保存はいま準備中です。ニックネームはマイページで保存できます。</p>
  <section class="panel auth-card">
    <form method="post" th:action="@{/mypage/settings}" novalidate>
      <h2 class="auth-section">基本情報</h2>
      <div class="auth-field"><label for="nickname">ニックネーム</label>
        <input type="text" id="nickname" name="nickname" maxlength="20" th:value="${nickname}" placeholder="例：たかはし"></div>
      <div class="auth-field"><label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="email" maxlength="100" placeholder="例：odekake@example.com"></div>
      <div class="auth-field"><label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="new-password" maxlength="64" placeholder="8文字以上"></div>
      <div class="auth-field"><label for="password2">パスワード（確認）</label>
        <input type="password" id="password2" name="password2" autocomplete="new-password" maxlength="64"></div>
      <h2 class="auth-section">おでかけの好み</h2>
      <div class="auth-field"><label for="area">よくおでかけする地域</label>
        <input type="text" id="area" name="area" maxlength="50" placeholder="例：愛知県"></div>
      <div class="auth-field"><span class="label">よく行くおでかけ</span>
        <div class="kind-select">
          <label><input type="checkbox" name="kinds" value="キャンプ"><span><i class="ico i-tent"></i>キャンプ</span></label>
          <label><input type="checkbox" name="kinds" value="旅行"><span><i class="ico i-suitcase"></i>旅行</span></label>
          <label><input type="checkbox" name="kinds" value="ピクニック"><span><i class="ico i-basket"></i>ピクニック</span></label>
        </div></div>
      <label class="auth-check"><input type="checkbox" name="newsletter"> おでかけDEPO からのお知らせメールを受け取る</label>
      <button class="btn btn-lg auth-submit" type="submit">保存する</button>
    </form>
  </section>
  <p><a th:href="@{/mypage}">← マイページに戻る</a></p>
</div></main>
<div th:replace="~{fragments/layout :: landscape}"></div>
</body>
</html>
