<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('マイページ')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('mypage')}"></header>
<main class="main narrow"><div class="content">
  <section class="page-hero hero-help">
    <h1><i class="ico i-people"></i><span class="brush">マイページ</span></h1>
    <p th:text="${nickname != null and nickname != ''} ? |こんにちは、${nickname}さん！| : 'ニックネームを登録すると、計画一覧で「ようこそ○○さん」と表示されます。'"></p>
  </section>
  <p th:if="${message != null}" th:class="${isError} ? 'flash-error' : 'done-msg'" th:text="${message}" role="status"></p>

  <section class="panel">
    <div class="panel-head"><h2><i class="ico i-people"></i>アカウント</h2></div>
    <div class="card-buttons">
      <a class="btn btn-sm" th:href="@{/login}">ログイン</a>
      <a class="btn btn-outline btn-sm" th:href="@{/mypage/settings}"><i class="ico i-pen"></i>ユーザー情報の設定</a>
    </div>
    <p class="tpl-note">ログインとユーザー情報の保存は、いま準備中です（画面だけ用意しています）。</p>
  </section>

  <section class="panel" style="margin-top:20px">
    <div class="panel-head"><h2><i class="ico i-pen"></i>ニックネーム</h2></div>
    <form class="add-row" method="post" th:action="@{/mypage}">
      <label for="nickname" class="sr-only">ニックネーム</label>
      <input type="text" id="nickname" name="nickname" maxlength="20" th:value="${nickname}" placeholder="例：たかはし（20文字まで）">
      <button class="btn btn-sm" type="submit">保存する</button>
    </form>
    <form method="post" th:action="@{/mypage/clear}" th:if="${nickname != null and nickname != ''}" style="margin-top:8px">
      <button class="link-btn" type="submit">ニックネームを消す</button>
    </form>
    <p class="tpl-note">ニックネームは、このブラウザにだけ保存されます（サーバーには保存しません）。パスワードを使ったログイン機能は、今後追加する予定です。</p>
  </section>

  <section class="panel" style="margin-top:20px">
    <div class="panel-head"><h2><i class="ico i-list"></i>メニュー</h2></div>
    <ul class="side-nav">
      <li><a th:href="@{/outings}"><i class="ico i-cal"></i>計画一覧・思い出</a></li>
      <li><a th:href="@{/products(view='favorites')}"><i class="ico i-heart"></i>お気に入り</a></li>
      <li><a th:href="@{/products(view='history')}"><i class="ico i-list"></i>購入履歴</a></li>
      <li><a th:href="@{/guide}"><i class="ico i-book"></i>使い方ガイド</a></li>
      <li><a th:href="@{/faq}"><i class="ico i-flag"></i>よくある質問</a></li>
    </ul>
  </section>

  <section class="panel" style="margin-top:20px">
    <div class="panel-head"><h2><i class="ico i-chart"></i>お店のスタッフ・保守担当の方へ</h2></div>
    <p><a class="btn btn-outline btn-sm" th:href="@{/admin}"><i class="ico i-chart"></i>管理者ページ（ランキング・言いかえ・特集）</a></p>
  </section>
</div></main>
<div th:replace="~{fragments/layout :: landscape}"></div>
</body>
</html>
