spring.application.name=odekake-depo
# MySQL の接続先
spring.datasource.url=jdbc:mysql://localhost:3306/odekake_depo?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
# ユーザー名・パスワードはここに書かない（GitHub に上げないため）
# ・src/main/resources/application-local.properties に書く（.gitignore に入っているので GitHub に上がらない）
# ・または環境変数 DB_USERNAME / DB_PASSWORD で渡す
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:classpath:application-local.properties
# 起動のたびに schema.sql と data.sql を実行（何度実行しても安全な書き方）
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# 日付の曜日を日本語で表示する
spring.web.locale=ja_JP
spring.web.locale-resolver=fixed
# 思い出の写真・動画
# 保存するフォルダ（OneDrive のフォルダを避けるため、ユーザーのホームの下にする）
app.upload-dir=${user.home}/odekake-depo-uploads
# 何日で自動的に消すか
app.photo-keep-days=7
# 1ファイル・1回のアップロードの上限
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
